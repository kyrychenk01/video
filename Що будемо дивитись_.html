<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Що будемо дивитись?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf3f1;--fg:#241829;--muted:#7b6b80;--track:#eadbd8;--hot:#ff3d5e;--warm:#ffa24a;--ok:#2bd48e;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d1d;--fg:#f6eef4;--muted:#a592ab;--track:#2a1f36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140d1d;--fg:#f6eef4;--muted:#a592ab;--track:#2a1f36;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;position:fixed;inset:0;width:100%}
.hidden{display:none!important}
.scr{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

/* intro */
#splash{z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(circle at 50% 38%,#3a1442 0,#150c20 62%);color:#fff;cursor:pointer;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.3);pointer-events:none}
.stage{position:relative;width:310px;height:310px;display:flex;align-items:center;justify-content:center;max-width:92vw}
.orbit{position:absolute;inset:0;animation:spin 18s linear infinite}
@keyframes spin{to{rotate:360deg}}
.t{position:absolute;left:50%;top:50%;width:46px;height:62px;margin:-31px 0 0 -23px;transform:rotate(var(--a)) translateY(-128px)}
.t img{width:100%;height:100%;object-fit:cover;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tIn .7s cubic-bezier(.2,1.5,.4,1) backwards,counter 18s linear infinite}
@keyframes tIn{from{scale:0;opacity:0}}
@keyframes counter{to{rotate:-360deg}}
.hero{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.hero img{width:140px;height:140px;border-radius:50%;object-fit:cover;position:relative;z-index:1;box-shadow:0 0 40px rgba(255,61,94,.65);animation:heroIn 1.1s cubic-bezier(.2,1.4,.4,1) backwards,bob 2.6s 1.1s ease-in-out infinite}
@keyframes heroIn{from{scale:.05;rotate:-240deg;opacity:0}}
@keyframes bob{50%{translate:0 -8px;rotate:4deg}}
.hero i{position:absolute;inset:8px;border-radius:50%;border:3px solid var(--hot);opacity:0;animation:ring 2.2s ease-out infinite}
.hero i:nth-child(2){animation-delay:.7s;border-color:var(--warm)}
.hero i:nth-child(3){animation-delay:1.4s}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(2.1);opacity:0}}
#ttl{margin:18px 0 22px;font-size:30px;font-weight:800;display:flex;flex-wrap:wrap;justify-content:center;text-align:center;padding:0 16px;letter-spacing:-.3px}
#ttl span{display:inline-block;animation:letter .55s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes letter{from{translate:0 44px;opacity:0;rotate:8deg}}
.go{border:0;border-radius:999px;padding:15px 38px;font:800 18px/1 inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,var(--hot),var(--warm));box-shadow:0 8px 26px rgba(255,61,94,.5);animation:letter .6s 1.7s backwards,throb 1.6s 2.3s ease-in-out infinite}
@keyframes throb{50%{scale:1.07}}

/* game */
#game{z-index:5;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;animation:drop .6s .1s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes drop{from{translate:0 -60px;opacity:0}}
.top .logo{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--hot)}
.top b{flex:1;font-size:19px;letter-spacing:-.2px}
.cnt{font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--track)}
.cnt.bump{animation:bump .4s}
@keyframes bump{40%{scale:1.18}}
.bar{height:8px;margin:6px 14px 0;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.3,1.3,.5,1);background:linear-gradient(90deg,var(--hot),var(--warm),var(--hot));background-size:200% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.arena{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:12px;padding:12px 12px 14px;position:relative}
@media (orientation:landscape) and (min-width:700px){.arena{grid-template-rows:none;grid-template-columns:1fr 1fr}}
.card{position:relative;border-radius:24px;overflow:hidden;background:#000;cursor:pointer;min-height:0;transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .7s;box-shadow:0 10px 28px rgba(0,0,0,.28);touch-action:manipulation}
.card:active{scale:.98}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.card .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(24px) brightness(.55) saturate(1.3)}
.card .fg{position:relative;width:100%;height:100%;object-fit:contain;padding:8px 8px 52px;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cap b{font-size:17px;line-height:1.15}
.crown{flex:none;font-size:14px;font-weight:800;padding:4px 10px;border-radius:99px;background:linear-gradient(90deg,#ffc83d,var(--warm));color:#3a2200}
.dealT{animation:dealT .85s cubic-bezier(.2,1.2,.3,1) backwards}
.dealB{animation:dealB .85s .15s cubic-bezier(.2,1.2,.3,1) backwards}
.promote{animation:promote .45s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes dealT{from{transform:translateY(-110vh) rotate(-16deg);opacity:0}}
@keyframes dealB{from{transform:translateY(110vh) rotate(16deg);opacity:0}}
@keyframes promote{from{transform:translateY(45%) scale(.94)}}
.vs{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:3;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--hot),var(--warm));box-shadow:0 0 0 6px var(--bg);pointer-events:none;animation:vsPop .7s .55s cubic-bezier(.2,1.7,.4,1) backwards}
@keyframes vsPop{from{scale:0;rotate:-200deg}}
.stamp{position:absolute;top:18px;z-index:2;padding:4px 14px;border:4px solid;border-radius:12px;font-weight:900;font-size:28px;letter-spacing:1px;opacity:0;scale:.3}
.stamp.yes{left:16px;color:var(--ok);rotate:-14deg}
.stamp.no{right:16px;color:var(--hot);rotate:14deg}
.card.win{animation:winPulse .7s ease forwards;z-index:2}
.card.win .yes{animation:stamp .5s .05s cubic-bezier(.2,1.8,.4,1) forwards}
.card.lose{opacity:0;transform:translateX(var(--dx)) rotate(var(--rot))}
.card.lose .no{animation:stamp .35s forwards}
@keyframes stamp{to{opacity:1;scale:1}}
@keyframes winPulse{50%{scale:1.05;box-shadow:0 0 0 10px rgba(43,212,142,.35)}to{scale:1.02}}

/* end */
#end{z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff;background:#140d1d}
#end .ebg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(30px) brightness(.4) saturate(1.4);animation:fadeIn 1s backwards}
@keyframes fadeIn{from{opacity:0}}
.ebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:0 20px;max-height:100%}
.crownL{font-size:60px;animation:crownIn 1s .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes crownIn{from{translate:0 -120px;opacity:0;rotate:-40deg}}
.small{font-size:17px;color:#e9d8ee;animation:letter .6s 1s backwards}
.pw{width:min(62vw,300px);aspect-ratio:2/3;max-height:46vh;border-radius:20px;overflow:hidden;background:#000;animation:champ 1.1s .2s cubic-bezier(.2,1.5,.4,1) backwards,glow 2.2s 1.4s ease-in-out infinite;box-shadow:0 0 0 6px #ffc83d}
.pw img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes champ{from{scale:0;rotate:-140deg}}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffc83d,0 0 50px 14px rgba(255,200,61,.5)}}
#end h2{margin:4px 0 6px;font-size:26px;line-height:1.15;animation:letter .6s 1.2s backwards}
.again{border:0;border-radius:999px;padding:14px 32px;font:800 17px/1 inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,var(--hot),var(--warm));box-shadow:0 8px 24px rgba(255,61,94,.5);animation:letter .6s 1.5s backwards}
.go:active,.again:active{scale:.95}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash" class="scr">
  <div class="stage"><div class="orbit" id="orbit"></div><div class="hero"><i></i><i></i><i></i><img data-face alt=""></div></div>
  <div id="ttl"></div>
  <button class="go" type="button">Почати</button>
</div>

<section id="game" class="scr hidden">
  <div class="top"><img class="logo" data-face alt=""><b>Що будемо дивитись?</b><span class="cnt" id="cnt"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="arena" id="arena"></div>
</section>

<section id="end" class="scr hidden"></section>

const TITLES=["Стендап: Спасибо у меня все #30","Супер Мама","Титаник","Без назви 1","Эверест","Один дома","Уся математика для НМТ","Без назви 2","Слово пацана","Вагітна у 16"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let order=[],champ,idx,wins,locked,promoted,first;

document.querySelectorAll("[data-face]").forEach(i=>i.src=FACE);
$("orbit").innerHTML=IMGS.map((s,i)=>`<div class="t" style="--a:${i*(360/IMGS.length)}deg"><img src="${s}" style="animation-delay:${.35+i*.09}s,0s" alt=""></div>`).join("");
$("ttl").innerHTML=[..."Що будемо дивитись?"].map((c,i)=>`<span style="animation-delay:${.7+i*.05}s">${c===" "?"\u00a0":c}</span>`).join("");
const TPL=$("splash").cloneNode(true);
function bindSplash(){$("splash").onclick=startGame;}
function showSplash(){
  $("game").classList.add("hidden");$("end").classList.add("hidden");
  const n=TPL.cloneNode(true);$("splash").replaceWith(n);bindSplash();
}
bindSplash();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  const s=$("splash");s.onclick=null;s.classList.add("out");
  order=shuffle(IMGS.map((src,i)=>({src,title:TITLES[i]||("Фото "+(i+1))})));
  champ=order[0];idx=1;wins=0;promoted=false;first=true;
  $("end").classList.add("hidden");$("game").classList.remove("hidden");
  render();
  setTimeout(()=>s.classList.add("hidden"),650);
}
function card(v,pos,cls,extra){
  return `<div class="card ${pos} ${cls}" data-pos="${pos}" tabindex="0" role="button" aria-label="${esc(v.title)}"><img class="bg" src="${v.src}" alt=""><img class="fg" src="${v.src}" alt=""><div class="cap"><b>${esc(v.title)}</b>${extra}</div><div class="stamp yes">ЛАЙК</div><div class="stamp no">ПАС</div></div>`;
}
function render(){
  locked=false;
  const total=order.length-1,c=$("cnt");
  c.textContent=idx+"/"+total;c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
  $("prog").style.width=((idx-1)/total*100)+"%";
  const badge=wins?`<span class="crown">👑 ${wins}</span>`:"";
  $("arena").innerHTML=card(champ,"top",first?"dealT":(promoted?"promote":""),badge)+`<div class="vs">VS</div>`+card(order[idx],"bot","dealB","");
  first=false;
  document.querySelectorAll(".card").forEach(el=>{
    el.onclick=()=>choose(el.dataset.pos);
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(el.dataset.pos);}};
  });
}
function choose(pos){
  if(locked)return;locked=true;
  const a=$("arena"),top=a.querySelector(".top"),bot=a.querySelector(".bot");
  const w=pos==="top"?top:bot,l=pos==="top"?bot:top;
  l.style.setProperty("--dx",pos==="top"?"130%":"-130%");
  l.style.setProperty("--rot",pos==="top"?"18deg":"-18deg");
  w.classList.add("win");l.classList.add("lose");
  const total=order.length-1;
  $("prog").style.width=(idx/total*100)+"%";
  setTimeout(()=>{
    if(pos==="top"){wins++;promoted=false;}
    else{champ=order[idx];wins=1;promoted=true;}
    idx++;
    if(idx>=order.length)finish();else render();
  },750);
}
function confetti(){
  const cols=["#ff3d5e","#ffa24a","#ffc83d","#2bd48e","#4aa8ff","#a96bff"];
  for(let i=0;i<80;i++){
    const d=document.createElement("div");d.className="conf";
    d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2+Math.random()*2.4)+"s";d.style.animationDelay=(Math.random()*1)+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),6000);
  }
}
function finish(){
  $("game").classList.add("hidden");
  const e=$("end");e.classList.remove("hidden");
  e.innerHTML=`<img class="ebg" src="${champ.src}" alt=""><div class="ebox"><div class="crownL">👑</div><div class="small">Сьогодні дивимось</div><div class="pw"><img src="${champ.src}" alt=""></div><h2>${esc(champ.title)}</h2><button class="again" type="button" id="again">Грати знову</button></div>`;
  $("again").onclick=showSplash;
  confetti();
}
document.addEventListener("keydown",e=>{
  if($("game").classList.contains("hidden"))return;
  if(e.key==="ArrowUp")choose("top");
  if(e.key==="ArrowDown")choose("bot");
});
</script>
</body>
</html>
